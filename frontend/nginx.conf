server {
    listen 80;
    server_name _;

    # 上传附件最大 10MB（与后端 max_upload_size_mb 对齐）
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # 后端地址的**运行时动态解析**
    #
    # 关键：nginx 对 proxy_pass 里的主机名默认是**启动时静态解析**，
    # 若启动瞬间容器 DNS 还解析不到服务名 `api`（容器编排下很常见），
    # nginx 会以 `[emerg] host not found in upstream "api"` 直接退出。
    # 因此这里改用变量 + resolver（Docker 内置 DNS 127.0.0.11）+ valid=10s，
    # 使解析推迟到请求时进行，后端后启动/重启也能自动恢复。
    # ---------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "http://api:8000";

    # gzip：降低内网首屏体积（手机端 4G 场景尤其明显）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # API 反代
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel 导入/导出可能较慢
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 后端接口文档（内网调试方便，如需关闭删除此段）
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带内容哈希的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，保证发版后立刻生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
