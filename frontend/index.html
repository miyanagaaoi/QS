<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0E4F4A" />
    <!--
      注意：刻意不写 maximum-scale=1 / user-scalable=no。
      PRD FR-RWD-07 要求保留系统字号与缩放能力，写死缩放会破坏无障碍。
      viewport-fit=cover 用于刘海屏安全区（配合 env(safe-area-inset-*)）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="采购询价与工程项目管理：询价单、供货商报价与比价、项目进度看板。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="采购与项目" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>采购与项目管理平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
